<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callsheet - Documentation</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        /* CSS Variables for consistent theming */
        :root {
            --primary-color: #3b82f6;
            --text-color: #333;
            --constrast-text-color: #000;
            --bg-color: #ffffff;
            --sidebar-bg: #f8fafc;
            --border-color: #e2e8f0;
            --code-bg: #f1f5f9;
            --hover-bg: #f1f5f9;
        }

        /* Dark mode variables */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: rgb(242, 255, 89);
                --text-color: #bbb;
                --constrast-text-color: #fff;
                --bg-color: rgb(14, 14, 13);
                --sidebar-bg: #262729;
                --border-color: #334155;
                --code-bg: #1e1f20;
                --hover-bg: #334155;
            }
        }

        /* Base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            line-height: 1.6;
        }

        /* Layout */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0.5rem 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            scrollbar-width: none; /* Hide scrollbar */
        }

        .sidebar:hover {
            scrollbar-width: auto; /* Show on hover */
        }

        .sidebar-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--constrast-text-color);
            margin-bottom: 0.75rem;
        }

        .sidebar-link {
            display: block;
            padding: 0.1rem 0.1rem 0.1rem 0.75rem;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .sidebar-link:hover {
            background-color: var(--hover-bg);
        }

        .sidebar-link.active {
            color: var(--primary-color);
            font-weight: 500;
        }

        /* Table of Contents */
        .toc-container {
            margin-bottom: 2rem;
        }

        .toc-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.75rem;
        }

        .toc-link {
            display: block;
            padding: 0.25rem 0;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 0.25rem;
            transition: background-color 0.2s;
            font-size: 0.875rem;
        }

        .toc-link:hover {
            background-color: var(--hover-bg);
        }

        .toc-link.active {
            color: var(--primary-color);
            font-weight: 500;
        }

        .toc-level-1 {
            padding-left: 0;
        }

        .toc-level-2 {
            padding-left: 1rem;
        }

        .toc-level-3 {
            padding-left: 2rem;
        }

        /* Main content */
        .main-content {
            flex: 1;
            padding: 2rem 3rem;
            max-width: 900px;
            overflow-y: auto;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        /* Markdown content styling */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            scroll-margin-top: 2rem; /* Add this for smooth scrolling */
        }

        h1 {
            font-size: 2.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.875rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        h3 {
            font-size: 1.5rem;
        }

        p {
            margin-bottom: 1rem;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        main a {
            color: var(--constrast-text-color);
            text-decoration: none;
            border-bottom: 1px solid var(--primary-color);
        }

        main a:hover {
            text-decoration: none;
            border-bottom-width: 2px;
        }

        ul, ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* Code blocks with copy button */
        pre {
            background-color: var(--code-bg);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
            position: relative;
            white-space: pre-wrap;
            max-height: 80vh;
            color: #fff;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
        }

        code:not(pre *) {
            /*color: var(--constrast-text-color);*/
            background: var(--code-bg);
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;            
        }

        pre code {
            background-color: transparent;
            padding: 0;
        }

        /* Copy button styles */
        .copy-button {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 0.25rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        pre:hover .copy-button,
        .copy-button.always-visible {
            opacity: 1;
        }

        .copy-button:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .copy-button.copied {
            background-color: rgba(34, 197, 94, 0.8);
        }

        .copy-button svg {
            width: 1rem;
            height: 1rem;
        }

        /* Mobile detection */
        @media (hover: none) {
            .copy-button {
                opacity: 1;
            }
        }

        /* Images */
        img {
            max-width: 100%;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .sidebar-title > img {
            max-width: 32px;
            border: 0;
            margin-right: 0.5rem;
            transform: translate(0px, 8px);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--sidebar-bg);
            font-weight: 600;
        }

        /* Blockquotes */
        blockquote {
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0.5rem;
            border-left: 4px solid var(--primary-color);
            background-color: var(--sidebar-bg);
        }

        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .main-content {
                padding: 1.5rem;
            }
        }

        @media (min-width: 1460px) {
            .toc-container {
                position: fixed;
                top: 20px;
                left: 1180px;
                width: 280px;
                overflow-y: auto;
                background: transparent;
                z-index: 100;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-title"><img src="images/favicon.ico"><i>Callsheet</i></div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">README</div>
                <div class="sidebar-link active" data-page="README#introduction">Introduction</div>
                <div class="sidebar-link" data-page="README#installation">Installation</div>
                <div class="sidebar-link" data-page="README#workflows">Workflows</div>
                <div class="sidebar-link" data-page="README#support">Support</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Prompting</div>
                <div class="sidebar-link" data-page="prompt-basics">Basics</div>
                <div class="sidebar-link" data-page="prompt-advanced">Advanced</div>
            </div>
            
            <div class="sidebar-section">
                <div class="sidebar-section-title">Pipelines From Scratch</div>
                <div class="sidebar-link" data-page="image-pipeline-from-scratch">Image Pipeline From Scratch</div>
                <div class="sidebar-link" data-page="video-pipeline-from-scratch">Video Pipeline From Scratch</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">SPECS</div>
                <div class="sidebar-link" data-page="nodes-essential">Node Essential</div>
                <div class="sidebar-link" data-page="nodes-utilities">Node Utilities</div>
                <div class="sidebar-link" data-page="callsheet-syntax">Callsheet Syntax</div>
                <div class="sidebar-link" data-page="specs-dev">Development</div>
            </div>

            <!-- Table of Contents (will be populated dynamically) -->
            <div class="toc-container" id="toc-container" style="display: none;">
                <div class="toc-title">Page Contents</div>
                <div id="toc-links"></div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content" id="content">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </main>
    </div>

    <script>
        // Configuration
        const markdownFiles = {
            'README': ['docs/README.md'],

            // pipelines-from-scratch
            'image-pipeline-from-scratch': ['docs/pipelines-from-scratch.md','docs/image-pipeline-from-scratch.md','docs/prompt-basics-images.md'],
            'video-pipeline-from-scratch': ['docs/pipelines-from-scratch.md','docs/video-pipeline-from-scratch.md','docs/prompt-basics-videos.md'],

            // prompt-guides
            'prompt-basics': ['docs/prompt-basics.md','docs/prompt-basics-images.md','docs/prompt-basics-videos.md'],
            'prompt-advanced': ['docs/prompt-advanced.md'],

            // specs
            'nodes-essential':['docs/nodes-essential.md'],
            'nodes-utilities':['docs/nodes-utilities.md'],
            'specs-syntax':['docs/specs-callsheet.md'],
            'specs-dev':['docs/specs-dev.md'],

            'fable':['docs/fable.md'],
        };

        // Current page
        //let currentPage = 'introduction';
        let currentPage = 'README';

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set up click handlers for sidebar links
            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            
            sidebarLinks.forEach(link => {
                link.addEventListener('click', function() {
                    const page = this.getAttribute('data-page');
                    if (page) {
                        loadPage(page);
                    }
                });
            });

            // Handle hash changes
            window.addEventListener('hashchange', function() {
                const hash = window.location.hash.substring(1);
                
                // Check if hash contains a heading anchor
                loadPage(hash);
            });
            
            // Check for hash in URL on initial load
            const hash = window.location.hash.substring(1);
            if (hash) {
                loadPage(hash);
            } else {
                // Load the initial page
                loadPage(currentPage);
            }
        });

        async function fetchAndCombineDocuments(documentUrls) {
            try {
                // Fetch all documents simultaneously
                const responses = await Promise.all(
                    documentUrls.map(url => fetch(url))
                );
                
                // Extract data from all responses
                const documents = await Promise.all(
                    responses.map(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to load ${markdownFiles[page]}: ${response.statusText}`);
                        }
                        return response.text()
                    })
                );
                
                // Combine and process the documents
                return documents.join('\n');
            } catch (error) {
                console.error('Error fetching documents:', error);
                throw error;
            }
        }

        // Function to load a page
        async function loadPage(page, headingId = null) {
            if (!markdownFiles[page]) {
                if (page.includes('#')) {
                    const parts = page.split('#');
                    page = parts[0];
                    headingId = parts.slice(1).join('#');
                    
                    if (!markdownFiles[page]) {
                        console.error(`Page ${page} not found`);
                        return;
                    }
                } else {
                    console.error(`Page ${page} not found`);
                    return;
                }
            }

            // Update active state
            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            sidebarLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('data-page') === page) {
                    link.classList.add('active');
                }
            });

            // Update URL hash
            window.location.hash = headingId? page + '#' + headingId : page;
            console.log(window.location.hash)

            // Show loading state
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const markdown = await fetchAndCombineDocuments(markdownFiles[page]);

                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true,
                    headerIds: true,
                    headerPrefix: ''
                });

                // Convert markdown to HTML
                const html = marked.parse(markdown) + '<div style="min-height:80vh"></div>';
                
                // Update content
                content.innerHTML = html;
                
                // Add copy buttons to code blocks
                addCopyButtons();
                
                // Update current page (before table of contents)
                currentPage = page;
                
                // Generate and display table of contents
                generateTableOfContents();
                
                // Re-highlight code blocks
                Prism.highlightAll();
                
                // Scroll to heading if specified
                if (headingId) {
                    setTimeout(() => {
                        const heading = document.getElementById(headingId);
                        if (heading) {
                            heading.scrollIntoView({ behavior: 'smooth' });
                            updateActiveTocLink(headingId);
                        }
                    }, 100);
                }
            } catch (error) {
                console.error('Error loading page:', error);
                content.innerHTML = `
                    <div class="error">
                        <h2>Error</h2>
                        <p>Failed to load page: ${error.message}</p>
                        <p>Please check that the file exists and try again.</p>
                    </div>
                `;
            }
        }

        // Function to generate table of contents
        function generateTableOfContents() {
            const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
            const tocContainer = document.getElementById('toc-container');
            const tocLinks = document.getElementById('toc-links');
            
            // Clear existing TOC
            tocLinks.innerHTML = '';
            
            // Hide TOC if no headings
            if (headings.length === 0) {
                tocContainer.style.display = 'none';
                return;
            }
            
            // Show TOC
            tocContainer.style.display = 'block';
            
            // Generate TOC links
            headings.forEach(heading => {
                // Generate ID if not present
                if (!heading.id) {
                    const text = heading.textContent.trim();
                    heading.id = text.toLowerCase()
                        .replace(/\s+/g, '-')
                        .replace(/[^\w\-]/g, '');
                }
                
                // Create TOC link
                const link = document.createElement('a');
                const hash = `${currentPage}#${heading.id}`;
                link.href = `#${hash}`;
                link.className = `toc-link toc-level-${parseInt(heading.tagName.substring(1))}`;
                link.textContent = heading.textContent;
                
                // Add click handler
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                    window.location.hash = hash;
                    updateActiveTocLink(heading.id);
                });
                
                tocLinks.appendChild(link);
            });
            
            // Set up scroll observer for active TOC link
            setupScrollObserver();
        }

        // Function to update active TOC link
        function updateActiveTocLink(activeId) {
            const tocLinks = document.querySelectorAll('.toc-link');
            tocLinks.forEach(link => {
                link.classList.remove('active');
                if (link.href.includes(`#${activeId}`)) {
                    link.classList.add('active');
                }
            });
        }

        // Function to set up scroll observer
        function setupScrollObserver() {
            const headings = document.querySelectorAll('#content h1, #content h2, #content h3, #content h4, #content h5, #content h6');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        updateActiveTocLink(entry.target.id);
                    }
                });
            }, {
                root: null,
                rootMargin: '-20% 0px -70% 0px'
            });
            
            headings.forEach(heading => {
                observer.observe(heading);
            });
        }

        // Function to add copy buttons to code blocks
        function addCopyButtons() {
            const codeBlocks = document.querySelectorAll('pre');
            
            codeBlocks.forEach(block => {
                // Skip if already has a copy button
                if (block.querySelector('.copy-button')) {
                    return;
                }
                
                // Create copy button
                const copyButton = document.createElement('button');
                copyButton.className = 'copy-button';
                copyButton.setAttribute('aria-label', 'Copy code');
                copyButton.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                        <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                    </svg>
                    <span>Copy</span>
                `;
                
                // Add click handler
                copyButton.addEventListener('click', function() {
                    const code = block.querySelector('code');
                    const text = code.textContent || code.innerText;
                    
                    // Copy to clipboard
                    navigator.clipboard.writeText(text).then(() => {
                        // Update button to show copied state
                        copyButton.classList.add('copied');
                        copyButton.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"/>
                            </svg>
                            <span>Copied!</span>
                        `;
                        
                        // Reset button after 2 seconds
                        setTimeout(() => {
                            copyButton.classList.remove('copied');
                            copyButton.innerHTML = `
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                                    <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                                </svg>
                                <span>Copy</span>
                            `;
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy text: ', err);
                    });
                });
                
                // Add button to code block
                block.appendChild(copyButton);
            });
        }
    </script>
</body>
</html>
